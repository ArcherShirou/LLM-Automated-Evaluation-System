<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评测详情 - 自动评估系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="evaluation.css">
</head>
<body>
    <!-- 警告容器 -->
    <div id="alertContainer"></div>
    
    <!-- 头部 -->
    <div class="header-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-2">
                            <li class="breadcrumb-item"><a href="/" class="text-white-50">首页</a></li>
                            <li class="breadcrumb-item active text-white" aria-current="page">评测详情</li>
                        </ol>
                    </nav>
                    <h1 class="mb-0"><i class="fas fa-microscope me-2"></i>评测详情</h1>
                    <p class="mb-0 mt-2" id="taskTitle">加载中...</p>
                    <p class="small mb-0 mt-1 text-white-50"><span id="createTime"></span><span id="submitter" class="ms-3" hidden></span><span class="ms-3">状态：<span id="taskStatus">加载中...</span></span></p>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-light me-2" id="backToHomeBtn">
                        <i class="fas fa-arrow-left me-1"></i>返回首页
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <!-- 文件配置区域 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-cog me-2"></i>评测方式</h5>
                    </div>
                    <div class="card-body">
                        <!-- 教师模型选择 -->
                        <div class="row mb-4" id="scoringOptions">
                            <div class="col-md-6">
                                <label for="teacherModelSelect" class="form-label">
                                    <i class="fas fa-robot me-2"></i>选择评分教师模型
                                </label>
                                <select class="form-select" id="teacherModelSelect">
                                    <option value="Deepseek" selected>Deepseek</option>
                                    <option value="GPT-oss">GPT-oss</option>
                                </select>
                                <div class="form-text">选择用于评分的AI教师模型</div>
                            </div>
                            <div class="col-md-6 d-flex align-items-center">
                                <details>
                                    <summary>高级选项</summary>
                                    <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="agentReview">
                                    <label class="form-check-label" for="agentReview">启用 Agent 二次复核</label>
                                    <div class="form-text">低分和临界分全部复核，高分抽样 10%；每道入选题增加一次模型调用。分歧需人工确认。</div>
                                    </div>
                                </details>
                            </div>
                        </div>
                        
                        <div id="fileConfigContainer">
                            <!-- 文件配置卡片将在这里动态生成 -->
                        </div>
                        <div class="text-center mt-3">
                            <button class="btn btn-primary me-2" id="startEvaluationBtn">
                                <i class="fas fa-play me-1"></i>开始评测
                            </button>
                            <button class="btn btn-danger" id="stopEvaluationBtn" style="display: none;">
                                <i class="fas fa-stop me-1"></i>停止评测
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 评测日志 -->
        <div class="row mb-4" id="progressContainer" style="display: none;">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-file-alt me-2"></i>评测日志</h5>
                    </div>
                    <div class="card-body">
                        <!-- 评测日志 -->
                        <div class="mb-3">
                            <div id="evaluationLog">
                                <!-- 评测日志和进度条将在这里显示 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 评测结果 -->
        <div class="row mb-4" id="resultsContainer" style="display: none;">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-chart-bar me-2"></i>评测结果</h5>
                    </div>
                    <div class="card-body">
                        <div id="resultsContent">
                            <!-- 评测结果将在这里显示 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-4" id="reviewContainer" style="display: none;">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-warning"><h5 class="mb-0">待人工复核</h5></div>
                    <div class="card-body">
                        <p class="text-muted">两模型分数差至少 0.5，或任一分数不高于 0.4 时列入。此清单仅用于复核排序，不代表医学结论。</p>
                        <p id="reviewSummary"></p>
                        <div class="table-responsive"><table class="table table-sm table-striped">
                            <thead><tr><th>ID</th><th>问题</th><th>Base</th><th>Compare</th><th>差值</th><th>复核原因</th></tr></thead>
                            <tbody id="reviewRows"></tbody>
                        </table></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-4" id="agentReviewContainer" style="display: none;">
            <div class="col-12"><div class="card shadow">
                <div class="card-header bg-warning"><h5 class="mb-0">Agent 待人工复核</h5></div>
                <div class="card-body">
                    <p class="text-muted">二次评分与初评相差至少 0.3，或二次评分失败时列入。初评分不会自动改写；这不是医学结论。</p>
                    <p id="agentReviewSummary"></p>
                    <div class="table-responsive"><table class="table table-sm table-striped">
                        <thead><tr><th>文件</th><th>ID</th><th>问题</th><th>初评分</th><th>复核分</th><th>状态</th><th>复核理由</th></tr></thead>
                        <tbody id="agentReviewRows"></tbody>
                    </table></div>
                </div>
            </div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="evaluation.js"></script>
</body>
</html>
