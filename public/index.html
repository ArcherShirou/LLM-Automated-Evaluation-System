<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动评估系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .header-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
        }
        .model-section {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .base-model {
            border-color: #28a745;
            background-color: #f8fff9;
        }
        .compare-model {
            border-color: #007bff;
            background-color: #f8f9ff;
        }
        .selected-file {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <div class="header-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12">
                    <h1 class="mb-0"><i class="fas fa-chart-line me-2"></i>自动评估系统</h1>
                    <p class="mb-0 mt-2">共享工作区：上传文件，选择评分方式，查看结果</p>
                </div>
                <div class="col-12 mt-3 d-flex flex-wrap gap-2">
                    <a class="btn btn-light" href="/scenario.html">场景评测</a>
                    <a class="btn btn-light" href="/completed-files.html">
                        <i class="fas fa-folder-open me-1"></i>已完成评估文件
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <!-- 文件选择区域 -->
        <div class="row mb-5">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-upload me-2"></i>创建新的评测任务</h4>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">任务名称 *</label>
                                    <input type="text" class="form-control" id="taskName" placeholder="请输入评测任务名称" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">提交人（可选）</label>
                                    <input type="text" class="form-control" id="submitter" placeholder="用于识别任务来源">
                                </div>
                            </div>
                            
                            <div class="row">
                                <!-- Base模型 -->
                                <div class="col-md-6">
                                    <div class="model-section base-model">
                                        <h5 class="text-success mb-3">
                                            <i class="fas fa-star me-2"></i>基准文件（可选）
                                        </h5>
                                        <p class="text-muted small mb-3">仅在需要比较两个文件时添加</p>
                                        
                                        <div class="mb-3">
                                            <div class="btn-group w-100" role="group">
                                                <input type="radio" class="btn-check" name="baseSource" id="baseUpload" value="upload" checked>
                                                <label class="btn btn-outline-success" for="baseUpload">
                                                    <i class="fas fa-upload me-1"></i>直接上传
                                                </label>
                                                <input type="radio" class="btn-check" name="baseSource" id="baseSelect" value="select">
                                                <label class="btn btn-outline-success" for="baseSelect">
                                                    <i class="fas fa-folder-open me-1"></i>从已完成文件选择
                                                </label>
                                            </div>
                                        </div>
                                        
                                        <div id="baseUploadArea">
                                            <input type="file" class="form-control" id="baseFile" accept=".xlsx" aria-label="Base模型 Excel 文件">
                                        </div>
                                        
                                        <div id="baseSelectArea" class="selected-file" style="display: none;">
                                            <p class="mb-2">已选择的文件：</p>
                                            <div id="baseSelectedFile" class="text-muted">未选择</div>
                                            <button type="button" class="btn btn-sm btn-outline-success mt-2" onclick="selectCompletedFile('base')">
                                                <i class="fas fa-search me-1"></i>选择文件
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- 对比模型 -->
                                <div class="col-md-6">
                                    <div class="model-section compare-model">
                                        <h5 class="text-primary mb-3">
                                            <i class="fas fa-balance-scale me-2"></i>待评测文件 *
                                        </h5>
                                        <p class="text-muted small mb-3">上传要评分或对比的文件</p>
                                        
                                        <div class="mb-3">
                                            <div class="btn-group w-100" role="group">
                                                <input type="radio" class="btn-check" name="compareSource" id="compareUpload" value="upload" checked>
                                                <label class="btn btn-outline-primary" for="compareUpload">
                                                    <i class="fas fa-upload me-1"></i>直接上传
                                                </label>
                                                <input type="radio" class="btn-check" name="compareSource" id="compareSelect" value="select">
                                                <label class="btn btn-outline-primary" for="compareSelect">
                                                    <i class="fas fa-folder-open me-1"></i>从已完成文件选择
                                                </label>
                                            </div>
                                        </div>
                                        
                                        <div id="compareUploadArea">
                                            <input type="file" class="form-control" id="compareFile" accept=".xlsx" aria-label="对比模型 Excel 文件">
                                        </div>
                                        
                                        <div id="compareSelectArea" class="selected-file" style="display: none;">
                                            <p class="mb-2">已选择的文件：</p>
                                            <div id="compareSelectedFile" class="text-muted">未选择</div>
                                            <button type="button" class="btn btn-sm btn-outline-primary mt-2" onclick="selectCompletedFile('compare')">
                                                <i class="fas fa-search me-1"></i>选择文件
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-success btn-lg" id="submitBtn" disabled>
                                    <i class="fas fa-rocket me-2"></i>创建评测任务
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 评测任务列表 -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0"><i class="fas fa-list me-2"></i>评测任务列表</h4>
                        <span class="badge bg-light text-dark" id="taskCount">0 个任务</span>
                    </div>
                    <div class="card-body">
                        <div id="tasksList">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>任务名称</th>
                                            <th>提交人</th>
                                            <th>提交时间</th>
                                            <th>状态</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tasksTableBody">
                                        <tr>
                                            <td colspan="5" class="text-center text-muted py-4">
                                                <i class="fas fa-inbox fa-2x mb-2"></i>
                                                <br>暂无评测任务
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
