<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>评测系统登录</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width: 460px">
  <h1 class="h3 mb-4">评测系统登录</h1>
  <form id="loginForm" class="card card-body">
    <label class="form-label" for="token">访问令牌</label>
    <input id="token" type="password" class="form-control mb-3" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">登录</button>
    <p id="error" class="text-danger mt-3 mb-0" role="alert"></p>
  </form>
</main><script src="/login.js"></script></body>
</html>
